name: Star improved-spork reported repos - Account 1

on:
  schedule:
    - cron: '55 15 * * *'
  workflow_dispatch:
    inputs:
      source_owner:
        description: 'Source owner (owner of improved-spork)'
        required: true
        default: 'Dippp10-ally'
      source_repo:
        description: 'Source repo that uploads the artifact'
        required: true
        default: 'improved-spork'
      artifact_prefix:
        description: 'Artifact name prefix'
        required: true
        default: 'python-project-report'
      max_repos:
        description: 'Maximum repos to star this run (safety limit)'
        required: true
        default: '10'
      dry_run:
        description: 'If true, do not actually call the star API'
        required: true
        default: 'false'

concurrency:
  group: star-reported-repos-account-1
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq unzip python3 python3-pip

      - name: Validate token for artifact access
        env:
          TOKEN: ${{ secrets.STAR_TOKEN_1 }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing secret STAR_TOKEN_1"
            exit 1
          fi

          USER_JSON=$(curl -sS \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user")

          login=$(echo "$USER_JSON" | jq -r '.login // empty')
          if [ -z "$login" ]; then
            echo "::error::STAR_TOKEN_1 authentication failed."
            echo "$USER_JSON"
            exit 1
          fi
          echo "Artifact account: $login"

      - name: Download latest matching artifact zip from source repo
        env:
          TOKEN: ${{ secrets.STAR_TOKEN_1 }}
          SOURCE_OWNER: ${{ inputs.source_owner || 'Dippp10-ally' }}
          SOURCE_REPO: ${{ inputs.source_repo || 'improved-spork' }}
          PREFIX: ${{ inputs.artifact_prefix || 'python-project-report' }}
        run: |
          set -euo pipefail

          SOURCE_OWNER="${SOURCE_OWNER:-Dippp10-ally}"
          SOURCE_REPO="${SOURCE_REPO:-improved-spork}"
          PREFIX="${PREFIX:-python-project-report}"

          mkdir -p artifact
          echo "Using source repo: ${SOURCE_OWNER}/${SOURCE_REPO}"
          echo "Using artifact prefix: ${PREFIX}"

          python3 - "$TOKEN" "$SOURCE_OWNER" "$SOURCE_REPO" "$PREFIX" > artifact_id.txt <<'PY'
          import json
          import sys
          import urllib.request

          token, owner, repo, prefix = sys.argv[1:5]

          page = 1
          artifacts = []
          while True:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{repo}/actions/artifacts?per_page=100&page={page}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "github-actions-workflow",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.load(resp)

              items = payload.get("artifacts", [])
              if not items:
                  break
              artifacts.extend(items)
              if len(items) < 100:
                  break
              page += 1

          matches = [a for a in artifacts if str(a.get("name", "")).startswith(prefix)]
          if not matches:
              raise SystemExit(f"No artifact found with prefix {prefix!r} in {owner}/{repo}")

          best = max(matches, key=lambda a: (a.get("updated_at") or ""))
          print(best["id"])
          PY

          ART_ID=$(tr -d '\r\n' < artifact_id.txt)
          if [ -z "$ART_ID" ] || [ "$ART_ID" = "null" ]; then
            echo "::error::No artifact found with prefix $PREFIX in $SOURCE_OWNER/$SOURCE_REPO"
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o artifact.zip \
            "https://api.github.com/repos/$SOURCE_OWNER/$SOURCE_REPO/actions/artifacts/$ART_ID/zip"

          unzip -q artifact.zip -d artifact

      - name: Extract repos list from project-report.csv
        env:
          MAX: ${{ inputs.max_repos || '10' }}
        run: |
          set -euo pipefail
          MAX="${MAX:-10}"

          CSV=$(find artifact -type f -name 'project-report.csv' | head -n 1 || true)
          if [ -z "$CSV" ]; then
            echo "::error::project-report.csv not found in artifact"
            exit 1
          fi

          python3 - "$CSV" "$MAX" <<'PY' > repos_to_star.txt
          import csv, re, sys

          csvfile = sys.argv[1]
          max_repos = int(sys.argv[2]) if len(sys.argv)
